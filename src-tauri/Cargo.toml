[package]
name         = "cloudsave-g4market"
version = "0.1.1"
description  = "Sao lưu save game lên Supabase — đọc đường dẫn từ Steam UFS và ludusavi-manifest"
edition      = "2021"
rust-version = "1.77"

[lib]
name       = "cloudsave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tokio   = { version = "1", features = ["fs", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

sha2   = "0.10"
zstd   = "0.13"
# Nén cực hạn cho cloud: mỗi file thử cả bốn, giữ cái nhỏ nhất (xem pack.rs).
# Đo trên save thật, không có thuật toán nào thắng mọi file.
xz2    = { version = "0.1", features = ["static"] }
brotli = "7"
bzip2  = "0.4"
base64 = "0.22"
hex    = "0.4"

globset = "0.4"
walkdir = "2"
dirs    = "5"
chrono  = { version = "0.4", features = ["serde"] }
uuid    = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
# Liệt kê tiến trình để biết game nào đang chạy (kể cả game mở ngoài Steam).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
log     = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Tắt Steam Cloud bằng cách "nhìn" cửa sổ Settings của Steam (OCR có sẵn của
# Windows) rồi bấm chuột — Steam không có API cho việc này (xem steam_ui.rs).
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# `#[tokio::test]` cần runtime + macro, mà bản dependency chính cố tình chỉ bật
# đúng các feature app dùng tới.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

# Thư viện nén (nhất là brotli, viết bằng Rust thuần) chạy chậm hàng chục lần
# khi không tối ưu hoá. Tối ưu riêng thư viện phụ thuộc ngay cả ở bản debug:
# code của app vẫn debug được, còn test và `tauri dev` nén ở tốc độ thật.
[profile.dev.package."*"]
opt-level = 3
